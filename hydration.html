<style>
:root{--clay:#C9A99A;--blush:#E8D5CE;--parchment:#F7F0EB;--sage:#8A9E8B;--sage-light:#C4D4C5;--ink:#2C2826;--warm-mid:#7A6860;--accent:#B8826E;--water:#7BAFD4;--water-light:#D6E8F5;--water-deep:#5B96C2;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--parchment);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse at 20% 10%,rgba(123,175,212,.18) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(138,158,139,.1) 0%,transparent 50%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:48px 24px 40px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--warm-mid);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;opacity:.6;}
.back:hover{opacity:1;}
.logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:.04em;line-height:1;margin-bottom:2px;}
.logo em{font-style:italic;color:var(--clay);}
.app-name{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--water-deep);margin-bottom:26px;}
.screen-title{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;line-height:1.1;margin-bottom:4px;}
.screen-title em{font-style:italic;color:var(--water);}
.section-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--warm-mid);margin-bottom:10px;font-weight:400;}
.card{background:white;border-radius:20px;padding:17px;border:1px solid rgba(201,169,154,.14);box-shadow:0 2px 12px rgba(44,40,38,.04);margin-bottom:14px;}
/* Big ring display */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 20px;}
.ring-svg{width:200px;height:200px;margin-bottom:16px;}
.ring-track{fill:none;stroke:var(--water-light);stroke-width:14;}
.ring-fill{fill:none;stroke:var(--water);stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px;transition:stroke-dashoffset .6s cubic-bezier(.34,1.56,.64,1);}
.ring-center{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;fill:var(--ink);}
.ring-unit{font-size:16px;fill:var(--warm-mid);}
.ring-label{font-size:12px;fill:var(--warm-mid);text-anchor:middle;}
.water-num{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--water-deep);text-align:center;}
/* Quick add */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.quick-btn{background:var(--water-light);border:1.5px solid rgba(123,175,212,.25);border-radius:16px;padding:15px 12px;cursor:pointer;text-align:center;transition:all .2s;font-family:'DM Sans',sans-serif;}
.quick-btn:hover{background:var(--water);border-color:var(--water);}
.quick-btn:hover .qb-amount,.quick-btn:hover .qb-label{color:white;}
.qb-icon{font-size:24px;margin-bottom:6px;}
.qb-amount{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--water-deep);line-height:1;}
.qb-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm-mid);margin-top:2px;}
/* Custom amount */
.custom-row{display:flex;gap:9px;align-items:center;margin-bottom:14px;}
.custom-inp{flex:1;border:1.5px solid rgba(123,175,212,.25);border-radius:50px;padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:white;outline:none;text-align:center;}
.custom-inp:focus{border-color:var(--water);}
.custom-btn{background:var(--water);color:white;border:none;border-radius:50px;padding:11px 20px;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap;}
.custom-btn:hover{background:var(--water-deep);}
/* Glasses display */
.glasses-wrap{background:linear-gradient(135deg,#e8f0f8,#d4e4f0);border-radius:18px;padding:18px;margin-bottom:14px;}
.glasses{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.glass{width:32px;height:37px;border-radius:3px 3px 8px 8px;border:1.5px solid rgba(74,122,155,.22);background:rgba(255,255,255,.45);cursor:pointer;transition:all .18s;position:relative;overflow:hidden;flex-shrink:0;}
.glass.filled{background:var(--water);border-color:var(--water-deep);}
.glass.filled::after{content:'';position:absolute;top:20%;left:12%;width:22%;height:45%;background:rgba(255,255,255,.32);border-radius:50%;}
/* Log list */
.log-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--parchment);border-radius:13px;margin-bottom:6px;animation:fadeUp .22s ease;}
.log-icon{font-size:18px;flex-shrink:0;}
.log-info{flex:1;}
.log-amount{font-size:14px;font-weight:400;color:var(--ink);}
.log-time{font-size:10px;color:var(--warm-mid);}
.log-remove{background:none;border:none;color:var(--warm-mid);opacity:.3;cursor:pointer;font-size:13px;padding:2px 5px;}
.log-remove:hover{opacity:.8;}
/* Stats */
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat-card{flex:1;background:white;border-radius:16px;padding:14px 10px;text-align:center;border:1px solid rgba(123,175,212,.15);}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--water-deep);line-height:1;margin-bottom:2px;}
.stat-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-mid);}
.goal-met{background:var(--water);border-radius:22px;padding:18px 20px;text-align:center;color:white;margin-bottom:14px;display:none;}
.goal-met.show{display:block;animation:fadeUp .4s ease;}
.goal-emoji{font-size:40px;margin-bottom:8px;}
.goal-msg{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;font-style:italic;}
.goal-sub{font-size:12px;opacity:.8;margin-top:4px;}
.toast{display:none;position:fixed;top:62px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:50px;padding:11px 22px;font-size:12px;z-index:400;white-space:nowrap;}
.toast.show{display:block;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1),toastOut .28s 2.2s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
</style>

<body>
<div class="wrap">
  <a class="back" href="index.html">← bloom</a>

  <div class="screen-title">Stay<br><em>hydrated</em></div>

    <div class="goal-emoji">💧</div>

  <!-- Ring -->
  <div class="card">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="82"/>
        <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="82" stroke-dasharray="515" stroke-dashoffset="515"/>
        <text class="ring-center" x="100" y="108" text-anchor="middle" id="ring-num">0</text>
        <text class="ring-unit" x="128" y="108">/ 8</text>
        <text class="ring-label" x="100" y="132">glasses</text>

      <div class="water-num" id="water-ml">0 ml today</div>

  <!-- Quick add — the primary action, right after the ring -->
  <div class="section-label">Quick add</div>
  <div class="quick-grid">
    <div class="quick-btn" onclick="addWater(150)"><div class="qb-icon">☕</div><div class="qb-amount">150ml</div><div class="qb-label">Small cup</div></div>
    <div class="quick-btn" onclick="addWater(250)"><div class="qb-icon">🥛</div><div class="qb-amount">250ml</div><div class="qb-label">Glass</div></div>
    <div class="quick-btn" onclick="addWater(500)"><div class="qb-icon">🍶</div><div class="qb-amount">500ml</div><div class="qb-label">Bottle</div></div>
    <div class="quick-btn" onclick="addWater(750)"><div class="qb-icon">🧴</div><div class="qb-amount">750ml</div><div class="qb-label">Large bottle</div></div>
  </div>

  <!-- Custom -->
  <div class="custom-row">

  <!-- Stats — secondary, below the action -->
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num" id="stat-streak">0</div><div class="stat-lbl">Day streak</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-avg">0</div><div class="stat-lbl">7-day avg</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-best">0</div><div class="stat-lbl">Best day</div></div>
  </div>

  <!-- Glasses visual -->
  <div class="glasses-wrap">
    <div class="section-label" style="color:#4a7a9b;">Today's glasses</div>
    <div class="glasses" id="glasses"></div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="section-label">Today's log</div>
    <div id="water-log"></div>
  </div>
</div>

<script>
const KEY='bloom_v1';
const ML_PER_GLASS=250;
const GOAL=8;
function td(d){const dt=d||new Date();return dt.toISOString().slice(0,10);}
const TODAY=td();
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return{sessions:[],nourish:{},sleep:{},bodyweight:[],measurements:[]};}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
let S=load();
function getTN(){if(!S.nourish[TODAY])S.nourish[TODAY]={water:0,waterLog:[],foods:[],drinks:[]};if(!S.nourish[TODAY].waterLog)S.nourish[TODAY].waterLog=[];return S.nourish[TODAY];}

function addWater(ml){
  const n=getTN();
  const now=new Date();
  const time=now.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:true});
  n.waterLog.unshift({id:Date.now(),ml,time});
  n.water=Math.round(n.waterLog.reduce((a,l)=>a+l.ml,0)/ML_PER_GLASS);
  save(S);render();
  if(n.water>=GOAL){document.getElementById('goal-met').classList.add('show');}
  showToast(`+${ml}ml logged 💧`);
}
function addCustom(){
  const val=parseInt(document.getElementById('custom-inp').value);
  if(!val||val<50){showToast('Enter at least 50ml');return;}
  document.getElementById('custom-inp').value='';
  addWater(val);
}
function removeEntry(idx){
  const n=getTN();n.waterLog.splice(idx,1);
  n.water=Math.round(n.waterLog.reduce((a,l)=>a+l.ml,0)/ML_PER_GLASS);
  save(S);render();
  document.getElementById('goal-met').classList.remove('show');
}

function render(){
  const n=getTN();
  const totalMl=n.waterLog.reduce((a,l)=>a+l.ml,0);
  const glasses=Math.min(GOAL,n.water);
  // Ring
  const circ=515;const offset=circ-(circ*glasses/GOAL);
  const rf=document.getElementById('ring-fill');if(rf)rf.style.strokeDashoffset=offset;
  const rn=document.getElementById('ring-num');if(rn)rn.textContent=glasses;
  const ml=document.getElementById('water-ml');if(ml)ml.textContent=`${totalMl} ml today`;
  // Glasses
  const gc=document.getElementById('glasses');if(gc){
    gc.innerHTML='';
    for(let i=0;i<GOAL;i++){const g=document.createElement('div');g.className='glass'+(i<glasses?' filled':'');gc.appendChild(g);}
  }
  // Stats
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(td(d));}
  const weekGlasses=days.map(d=>(S.nourish[d]||{water:0}).water);
  const avg=weekGlasses.length?(weekGlasses.reduce((a,b)=>a+b,0)/7).toFixed(1):0;
  const best=Math.max(...weekGlasses,0);
  // Streak
  let streak=0;
  for(const d of days){if((S.nourish[d]||{water:0}).water>=GOAL)streak++;else break;}
  const ss=document.getElementById('stat-streak');if(ss)ss.textContent=streak;
  const sa=document.getElementById('stat-avg');if(sa)sa.textContent=avg;
  const sb=document.getElementById('stat-best');if(sb)sb.textContent=best;
  // Log
  const log=document.getElementById('water-log');if(log){
    if(!n.waterLog.length){log.innerHTML='<div style="font-size:12px;color:var(--warm-mid);opacity:.4;">No drinks logged yet — tap a quick add above</div>';return;}
    log.innerHTML=n.waterLog.map((l,i)=>`
      <div class="log-item">
        <span class="log-icon">${l.ml>=500?'🍶':l.ml>=250?'🥛':'☕'}</span>
        <div class="log-info"><div class="log-amount">${l.ml} ml</div><div class="log-time">${l.time}</div></div>
        <button class="log-remove" onclick="removeEntry(${i})">✕</button>
      </div>`).join('');
  }
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast',2700);}
document.getElementById('custom-inp').addEventListener('keydown',e=>{if(e.key==='Enter')addCustom();});

render();
if(getTN().water>=GOAL)document.getElementById('goal-met').classList.add('show');
</script>
</body>
</html>
